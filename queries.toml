# ── Hard queries (5) ─────────────────────────────────────────────────────────
# Paraphrased, multi-hop, or ambiguous — designed to stress each config.

[[query]]
id = 16
text = "annual race held on an island known for dangerous road circuit since 1907"
relevant_ids = [231]
hard = true
note = "Paraphrase of Isle of Man TT — no keywords overlap with title; tests semantic retrieval"

[[query]]
id = 17
text = "sport combining board game with combat until checkmate or knockout"
relevant_ids = [116]
hard = true
note = "Chess boxing described as alternating blitz chess and boxing rounds — zero title overlap"

[[query]]
id = 18
text = "cyclist awarded yellow jersey leading general classification"
relevant_ids = [233]
hard = true
note = "Yellow jersey / maillot jaune is Tour de France specific — not mentioned in title"

[[query]]
id = 19
text = "oldest grand slam tennis tournament played on grass courts in London"
relevant_ids = [234]
hard = true
note = "Multi-attribute paraphrase of Wimbledon; 'oldest grand slam' requires inference"

[[query]]
id = 20
text = "satirical obituary gave name to biennual cricket rivalry between two nations"
relevant_ids = [238]
hard = true
note = "The Ashes origin story — body text only, title gives nothing away"
