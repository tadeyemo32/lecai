# queries.toml — 20 hand-labelled retrieval queries
# Each query lists the doc_ids that must appear in top-5 (at least one).
# hard = true marks the 5 deliberately difficult queries.

# ── Easy queries (15) ────────────────────────────────────────────────────────

[[query]]
id = 1
text = "Formula One motor racing world championship"
relevant_ids = [232, 146]
hard = false
note = "Direct title match — baseline sanity check for all configs"

[[query]]
id = 2
text = "UFC mixed martial arts heavyweight fights"
relevant_ids = [227, 195]
hard = false
note = "UFC page is in corpus; martial arts is a parent category"

[[query]]
id = 3
text = "Olympic Games summer sports international competition"
relevant_ids = [228, 1]
hard = false
note = "Olympic Games page plus the federation overview"

[[query]]
id = 4
text = "FIFA World Cup football tournament"
relevant_ids = [229, 18]
hard = false
note = "World Cup and association football both in corpus"

[[query]]
id = 5
